name: Tier 2 — Payload

# Full pipeline for a Payload tenant. Database changes are code here, so the pipeline is
# built around that: migrations are proven against a throwaway database before merge,
# audited against production before deploy, and a restore point is taken seconds before
# the deploy is allowed to touch anything.
#
# Two build modes, chosen per tenant by the `image-mode` input.
#
# image-mode: false (default) — Coolify builds on the box from git. This is where every
# tenant starts and is still correct; it just means the image is built on the machine that
# serves traffic, and cannot be reproduced or rolled back independently of the source.
#
# image-mode: true — this workflow builds the image and pushes it to GHCR, then points
# Coolify at the tag. Available because Payload builds are now hermetic: `next build` no
# longer reaches Postgres, so it runs on a runner. The tag IS the artifact, so a rollback
# is re-pointing at the previous tag with no rebuild.
#
# Note what moves with it: migrations no longer run inside the build, so a bad migration no
# longer fails the build and leaves the old container serving. That safety came for free in
# git-build mode and has to be bought back explicitly — which is what the restore point
# below is for, taken seconds before the deploy rather than last night.

on:
  workflow_call:
    inputs:
      app-uuid:
        description: Coolify application uuid — the app to deploy
        required: true
        type: string
      db-name:
        description: Coolify database name, e.g. inkfoundation-db
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "22"
      pnpm-version:
        # Empty so pnpm/action-setup reads packageManager; passing both is a hard error.
        required: false
        type: string
        default: ""
      deploy:
        description: Deploy after the checks. Pull requests should pass false.
        required: false
        type: boolean
        default: true
      run-e2e:
        required: false
        type: boolean
        default: false
      image-mode:
        description: Build the image here and push to GHCR, instead of letting Coolify build on the box.
        required: false
        type: boolean
        default: false
    secrets:
      # Must be declared. A caller that passes a secret this workflow does not declare is an
      # invalid workflow file, and every run dies with `startup_failure` before any step —
      # which is exactly what the tenant callers do, because they pass it explicitly.
      SSH_PRIVATE_KEY:
        required: true

# Concurrency is job-level: `inputs` is not visible at workflow_call top-level scope.

jobs:
  # ---------------------------------------------------------------------------
  check:
    name: Checks and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      PREVIEW_SECRET: ci-only-not-a-real-secret
      CRON_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "${{ inputs.pnpm-version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run --if-present lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: The import map must match the config
        # Payload resolves every admin UI component through importMap.js. A component that is
        # missing does not throw: the admin renders a blank page, every asset returns 200, and
        # only the server log says why. That is what happened to ink-cms on 2026-08-07, and it
        # went unnoticed because the map had been generated in an environment where a
        # secret-gated plugin was not loaded. Regenerating here makes the disagreement fail
        # the build instead of the browser.
        run: |
          set -euo pipefail
          pnpm payload generate:importmap
          if ! git diff --quiet -- 'src/app/(payload)/admin/importMap.js'; then
            echo "::error::importMap.js is out of date — run pnpm generate:importmap and commit it"
            git --no-pager diff -- 'src/app/(payload)/admin/importMap.js' | head -40
            exit 1
          fi
          echo "Import map matches the config."

      - name: Migrations apply to an empty database
        # The strongest guarantee available before merge: the whole chain runs from
        # nothing. This is also the disaster-recovery path, so a break here means a
        # rebuild from backup would fail too.
        run: pnpm payload migrate --force-accept-warning

      - name: Migrations are idempotent
        # A second run must be a no-op. Catches a migration that re-creates something it
        # already created — harmless on an empty database, fatal on production.
        run: pnpm payload migrate --force-accept-warning

      - name: Integration tests
        run: pnpm run --if-present test:int

      - name: E2E tests
        if: inputs.run-e2e
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run --if-present test:e2e

  # ---------------------------------------------------------------------------
  audit:
    name: Audit migrations against production
    if: inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reach the box
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_IP: ${{ vars.OVH_VPS_IP }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci && chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: An applied migration must never disappear from the repo
        env:
          VPS_IP: ${{ vars.OVH_VPS_IP }}
          DB: ${{ inputs.db-name }}
        run: |
          set -euo pipefail
          APPLIED=$(ssh -n -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" "migrations ${DB}")
          echo "Production has applied $(echo "$APPLIED" | wc -l | tr -d ' ') migration(s)."

          MISSING=""
          while read -r M; do
            [ -z "$M" ] && continue
            [ -f "src/migrations/${M}.ts" ] || MISSING="${MISSING} ${M}"
          done <<< "$APPLIED"

          if [ -n "$MISSING" ]; then
            echo "::error::Applied in production but absent from this commit:${MISSING}"
            echo "Payload records only a name, so the database keeps whatever the deleted"
            echo "file did while the repo claims otherwise, and nothing ever surfaces the"
            echo "disagreement. Restore the file, or write a forward migration."
            exit 1
          fi
          echo "Every applied migration is still present in the repo."

          PENDING=""
          for F in src/migrations/*.ts; do
            [ -e "$F" ] || continue
            N=$(basename "$F" .ts)
            [ "$N" = index ] && continue
            echo "$APPLIED" | grep -qx "$N" || PENDING="${PENDING} ${N}"
          done
          if [ -n "$PENDING" ]; then
            echo "::notice::This deploy will apply:${PENDING}"
          else
            echo "::notice::No pending migrations."
          fi

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Build the artifact once, here, and never again. Only possible because the build is
  # hermetic: no DATABASE_URL, no build-args, so the image is a pure function of the commit.
  image:
    name: Build and push the image
    if: inputs.deploy && inputs.image-mode
    # Deliberately depends on nothing, so it starts at the same moment as `check` instead of
    # queueing behind it. The image is the slowest job and the checks do not inform it -- the
    # build is a pure function of the source either way.
    #
    # Nothing unchecked can reach production from this: `deploy` requires check AND audit to
    # have succeeded before it will patch a tag. The worst case is an image pushed for a commit
    # that failed lint, which costs a little registry space and is never deployed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # validated at startup, before `if:` is evaluated — must be declared
    outputs:
      name: ${{ steps.ref.outputs.name }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image reference
        id: ref
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path segments and several owners here are mixed-case orgs.
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token. No PAT is stored anywhere for pushing; the box holds a
          # separate read-only token for pulling.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Only the immutable sha tag is published. A moving `latest` would make the
          # deployed tag ambiguous and silently break rollback-by-tag.
          tags: ${{ steps.ref.outputs.name }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Back up, deploy, verify
    needs: [check, audit, image]
    # A skipped dependency skips its dependents, so `needs: [image]` alone would disable
    # deploys entirely whenever image-mode is off. Naming each result keeps both modes live —
    # and because an explicit `if:` also runs on failed dependencies, success is required here
    # rather than assumed.
    if: >-
      inputs.deploy && !cancelled()
      && needs.check.result == 'success'
      && needs.audit.result == 'success'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      # Two deploys of one tenant must never interleave — they would race the same database.
      # Not cancel-in-progress: a half-finished migration is worse than a queued deploy.
      group: tier2-${{ inputs.app-uuid }}
      cancel-in-progress: false
    steps:
      - name: Reach the box
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_IP: ${{ vars.OVH_VPS_IP }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci && chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restore point, taken now
        id: backup
        env:
          VPS_IP: ${{ vars.OVH_VPS_IP }}
          DB: ${{ inputs.db-name }}
        run: |
          set -euo pipefail
          OUT=$(ssh -n -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" \
                 "predeploy-backup ${DB} ${GITHUB_SHA::12}")
          KEY=$(echo "$OUT" | awk '{print $1}')
          SIZE=$(echo "$OUT" | awk '{print $2}')
          [ -n "$KEY" ] || { echo "::error::backup produced no key — refusing to deploy"; exit 1; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "::notice::Restore point $KEY ($SIZE bytes)"

      - name: Point Coolify at the new image
        if: inputs.image-mode
        env:
          VPS_IP: ${{ vars.OVH_VPS_IP }}
          APP: ${{ inputs.app-uuid }}
          IMAGE: ${{ needs.image.outputs.name }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          # An app still on build_pack=dockerfile builds from git and ignores these fields, so
          # patching it writes registry settings onto an app that will never read them. Skip
          # instead: that makes image-mode safe to switch on BEFORE the app is converted, which
          # is the only way to get a first image into the registry to convert it with.
          PACK=$(ssh -n -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" \
                   "coolify GET /api/v1/applications/${APP}" | jq -r '.build_pack // "unknown"')
          if [ "$PACK" != "dockerimage" ]; then
            echo "::notice::${IMAGE}:${TAG} pushed. App is build_pack=${PACK}, so Coolify will build from git; not patching the tag."
            exit 0
          fi

          # No -n here: the dispatcher reads a PATCH body from stdin, and -n would send it /dev/null.
          BODY=$(jq -nc --arg n "$IMAGE" --arg t "$TAG" \
                  '{docker_registry_image_name:$n, docker_registry_image_tag:$t}')
          R=$(printf '%s' "$BODY" | ssh -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" \
                "coolify PATCH /api/v1/applications/${APP}")
          # Coolify answers 200 with a {"message": ...} body on some failures, so the response
          # is read back rather than trusted.
          echo "$R" | jq -e '.uuid // .id' >/dev/null \
            || { echo "::error::tag patch rejected: $R"; exit 1; }
          echo "::notice::Deploying ${IMAGE}:${TAG}"

      - name: Deploy
        env:
          VPS_IP: ${{ vars.OVH_VPS_IP }}
          APP: ${{ inputs.app-uuid }}
        run: |
          set -euo pipefail
          cool() { ssh -n -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" "coolify $1 $2"; }

          DEP=$(cool POST "/api/v1/deploy?uuid=${APP}" | jq -r '.deployments[0].deployment_uuid // empty')
          [ -n "$DEP" ] || { echo "::error::deploy did not queue"; exit 1; }
          echo "Deployment $DEP"

          for _ in $(seq 1 90); do
            S=$(cool GET "/api/v1/deployments/${DEP}" | jq -r '.status // "unknown"')
            case "$S" in
              finished|success) echo "Deployment finished."; exit 0;;
              failed|error|cancelled)
                echo "::error::Deployment $S — the previous container is still serving"
                exit 1;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the deployment"; exit 1

      - name: Health gate
        env:
          VPS_IP: ${{ vars.OVH_VPS_IP }}
          APP: ${{ inputs.app-uuid }}
        run: |
          set -euo pipefail
          cool() { ssh -n -i ~/.ssh/id_ci -o BatchMode=yes "ci@${VPS_IP}" "coolify $1 $2"; }
          # Coolify says the deployment finished; this asks the application itself.
          for _ in $(seq 1 30); do
            S=$(cool GET "/api/v1/applications/${APP}" | jq -r '.status // "unknown"')
            echo "  $S"
            # Only 'healthy' ends this early. A container is briefly exited/unhealthy while
            # the new one starts and the old one drains, so treating that as terminal failed
            # deploys that went on to succeed -- exactly what happened to ink and acmeplexus
            # on 2026-08-07, both marked failed while serving the new build correctly.
            case "$S" in
              running:healthy) echo "Healthy."; exit 0;;
            esac
            sleep 10
          done
          echo "::error::Never reported healthy"; exit 1

      - name: If anything failed, say exactly how to undo it
        if: failure()
        env:
          KEY: ${{ steps.backup.outputs.key }}
          DB: ${{ inputs.db-name }}
        run: |
          echo "::error::Deploy failed. The previous container is still serving."
          echo ""
          echo "Migrations may have been applied before the failure. The restore point"
          echo "taken immediately before this deploy:"
          echo ""
          echo "  r2://acmeplexus-backups/${KEY}"
          echo ""
          echo "Restore it with:  ./infra backup restore ${DB} --key ${KEY}"
